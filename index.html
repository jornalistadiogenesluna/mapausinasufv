<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="description" content="Mapa interativo sobre a ocupacao territorial por usinas fotovoltaicas de grande porte no Nordeste.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

<body>

      </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="assets/mapa.js"></script>
  <script src="assets/integracao.js"></script>
