<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de integração no Elementor</title>
  <style>
    html, body { margin: 0; background: #f3efe4; }
    .webmap-usinas-ne { width: 100%; height: clamp(640px, 85svh, 900px); }
    .webmap-usinas-ne iframe { display: block; width: 100%; height: 100%; border: 0; }
    @media (max-width: 760px) { .webmap-usinas-ne { height: 100svh; min-height: 520px; } }
    @media (max-height: 560px) and (orientation: landscape) {
      .webmap-usinas-ne { height: 100svh; min-height: 360px; }
    }
  </style>
</head>
<body>
  <div class="webmap-usinas-ne">
    <iframe
      title="Mapa interativo das usinas solares do Nordeste"
      src="./index.html"
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
  </div>
</body>
</html>
